<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interview – Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #E8E6E6;
      color: #111;
      line-height: 1.7;
      padding-bottom: 4rem;

    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    header {
      padding: 2rem;
      border-bottom: 1px solid #ccc;
      background: #dedede;
    }

    header h1 {
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .wrapper {
      max-width: 640px;
      width: 100%;
      padding: 2.5rem 1.8rem 3rem;
      background: #dedede;
      border-radius: 18px;
      border: 1px solid #c4c4c4;
      box-shadow: 0 18px 40px rgba(146, 7, 167, 0.473);
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .wrapper {
        max-width: 100%;
        padding: 1.5rem 1rem 2rem;
      }

      img {
        width: 100% !important;
        height: auto !important;
      }
    }

    .corner-image {
      position: absolute;
      top: 210px;
      right: 20px;
      width: 350px;
      margin: 0;
      z-index: 10;
    }

    .corner-image img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    .corner-image figcaption {
      font-size: 0.75rem;
      text-align: center;
      font-style: italic;
      color: #555;
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .corner-image {
        display: none;
      }
    }

    .qa-block {
      margin-bottom: 2rem;
    }

    .question {
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .answer {
      font-weight: 400;
      opacity: 0.85;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      text-decoration: none;
      color: #333;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .gallery-section {
      margin-top: 3rem;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    .gallery-title {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.2rem;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #dedede;
      border: 1px solid #c4c4c4;
      box-shadow: 0 10px 24px rgba(146, 7, 167, 0.18);
      transition: transform 0.28s ease, box-shadow 0.28s ease;
      cursor: pointer;
    }

    .photo-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 34px rgba(146, 7, 167, 0.28);
    }

    .photo-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .photo-card:hover img {
      transform: scale(1.08);
      filter: brightness(0.72);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.08));
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
      box-sizing: border-box;
    }

    .photo-card:hover .photo-overlay {
      opacity: 1;
    }

    .photo-caption {
      color: #fff;
      font-size: 0.9rem;
      line-height: 1.4;
      transform: translateY(12px);
      transition: transform 0.3s ease;
    }

    .photo-card:hover .photo-caption {
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .photo-card img {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Bikes of Sydney</h1>
    <h2>Via Everyday Bike Style on Instagram</h2>

    <a href="Blog_Entry.html" class="back-link" style="color: #333;">⟵ FULL-TIME MAG INDEX</a>
  </header>

    <section class="gallery-section">
      <div class="gallery-title">Bikes of sydney </div>

      <div class="photo-gallery">
        <div class="photo-card">
          <img src="../Images/Bikes/greengreen.JPG" alt="Green Bike">
          <div class="photo-overlay">
            <div class="photo-caption">Green Bike with cool frame. Photo credit: Liam Hunter. </div>
          </div>
        </div>

        <div class="photo-card">
          <img src="../Images/Bikes/Bianchi1.JPG" alt="Bianchi Bike">
          <div class="photo-overlay">
            <div class="photo-caption">Fresh Bianchi Bike. Photo credit: Liam Hunter</div>
          </div>
        </div>

        <div class="photo-card">
          <img src="../Images/Bikes/Crate1.JPG" alt="Sick bike with Crate">
          <div class="photo-overlay">
            <div class="photo-caption">Sick bike with Crate. Photo credit: Liam Hunter</div>
          </div>
        </div>

        <div class="photo-card">
          <img src="../Images/Bikes/Yellow2.JPG" alt="Yellow Cannondale">
          <div class="photo-overlay">
            <div class="photo-caption">Yellow Cannondale. Photo credit: Liam Hunter</div>
          </div>
        </div>
      </div>
    </section>

  </div>

</body>
</html>
